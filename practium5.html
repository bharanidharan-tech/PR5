<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigation Bar</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }

        nav {
            background-color: #222;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding: 15px 30px;
            gap: 25px;
        }

        .menu {
            position: relative;
        }

        .menu a,
        .contact {
            color: white;
            text-decoration: none;
            font-size: 16px;
            display: block;
            padding: 10px;
        }

        .arrow {
            font-size: 13px;
            margin-left: 5px;
        }

        .dropdown {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            background-color: #222;
            min-width: 160px;
            z-index: 10;
        }

        .dropdown a {
            padding: 18px 15px;
            color: white;
        }

        .dropdown a:hover {
            background-color: #444;
        }

        .menu:hover .dropdown {
            display: block;
        }

        .login {
            background-color: #1685e8;
            color: white;
            padding: 15px 20px;
            text-decoration: none;
        }

        .signup {
            border: 1px solid #1685e8;
            color: white;
            padding: 14px 20px;
            text-decoration: none;
        }

        .login:hover {
            background-color: #006dcc;
        }

        .signup:hover {
            background-color: #1685e8;
        }
    </style>
</head>

<body>

    <nav>
        <div class="menu">
            <a href="#">Blog <span class="arrow">⌄</span></a>

            <div class="dropdown">
                <a href="#">Latest Posts</a>
                <a href="#">Tutorials</a>
                <a href="#">News</a>
            </div>
        </div>

        <div class="menu">
            <a href="#">Plans <span class="arrow">⌄</span></a>

            <div class="dropdown">
                <a href="#">Freelancer</a>
                <a href="#">Startup</a>
                <a href="#">Enterprise</a>
            </div>
        </div>

        <a href="#" class="contact">Contact</a>

        <a href="#" class="login">Log In</a>

        <a href="#" class="signup">Sign Up</a>
    </nav>

</body>
</html>
